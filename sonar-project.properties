# SonarQube analysis of Pasta Lite (sonar-scanner reads this from the repository root).
sonar.projectKey=pasta-lite
sonar.projectName=pasta-lite
sonar.sourceEncoding=UTF-8

# Main-process code (main.js, preloads, src/), the renderer scripts and the dev scripts are sources;
# test/ holds the node:test suites and their fixtures.
sonar.sources=main.js,preload.js,preload-tabs.js,src,renderer,scripts
sonar.tests=test
sonar.exclusions=**/node_modules/**,docs/**
# The suites run under node:test without an lcov report, so coverage is not measured.
sonar.coverage.exclusions=**/*

# Blame comes from git. A scan of a linked worktree mounted without its main .git (as in a
# container) has to pass -Dsonar.scm.disabled=true.
sonar.scm.provider=git

# ---------------------------------------------------------------------------------------------
# Rules disabled for the whole project. Each one is reviewed noise for this code base: the rule
# either contradicts a deliberate convention or fires on every file for reasons the code can't
# change. Rules that find real problems stay on, and a false positive of one of those is marked
# on its line with "// NOSONAR(<rule>): <reason>".
sonar.issue.ignore.multicriteria=\
  optChain,globalThis,todo,commentedCode,at,stringRaw,replaceAll,negated,nestedTpl,\
  codePoint,spreadIter,outerScope,numberStatic,spreadFallback,mathMinMax,numberWrapper,\
  domBefore,setHas,includes,typeofUndef,findLast,structuredClone,nesting,cognitive

# S6582 (optional chaining): the `a && a.b` guards are the code base's deliberate style.
sonar.issue.ignore.multicriteria.optChain.ruleKey=javascript:S6582
sonar.issue.ignore.multicriteria.optChain.resourceKey=**/*
# S7764 (globalThis): the renderer IIFEs attach their APIs to `window` on purpose (browser
# scripts, and the tests' fake window).
sonar.issue.ignore.multicriteria.globalThis.ruleKey=javascript:S7764
sonar.issue.ignore.multicriteria.globalThis.resourceKey=**/*
# S1135 (TODO tags): every hit is the git rebase *todo list*, not a to-do note.
sonar.issue.ignore.multicriteria.todo.ruleKey=javascript:S1135
sonar.issue.ignore.multicriteria.todo.resourceKey=**/*
# S125 (commented-out code): the hits are shape comments such as `// {summary, description}`.
sonar.issue.ignore.multicriteria.commentedCode.ruleKey=javascript:S125
sonar.issue.ignore.multicriteria.commentedCode.resourceKey=**/*

# Modern-JS style rules: pure preferences with no correctness effect here.
# S7755 (.at()): `a[a.length - 1]` is the house style.
sonar.issue.ignore.multicriteria.at.ruleKey=javascript:S7755
sonar.issue.ignore.multicriteria.at.resourceKey=**/*
# S7780 (String.raw): escaped backslashes in regex sources and git paths read fine as they are.
sonar.issue.ignore.multicriteria.stringRaw.ruleKey=javascript:S7780
sonar.issue.ignore.multicriteria.stringRaw.resourceKey=**/*
# S7781 (replaceAll): `replace(/x/g, ...)` is equivalent; the regexes are needed anyway.
sonar.issue.ignore.multicriteria.replaceAll.ruleKey=javascript:S7781
sonar.issue.ignore.multicriteria.replaceAll.resourceKey=**/*
# S7735 (negated condition with else): the early / common case is written first on purpose.
sonar.issue.ignore.multicriteria.negated.ruleKey=javascript:S7735
sonar.issue.ignore.multicriteria.negated.resourceKey=**/*
# S4624 (nested template literals): used for short optional suffixes in display strings.
sonar.issue.ignore.multicriteria.nestedTpl.ruleKey=javascript:S4624
sonar.issue.ignore.multicriteria.nestedTpl.resourceKey=**/*
# S7758 (codePointAt): the charCodeAt calls read latin1 byte strings and ASCII, where code units
# are what is wanted.
sonar.issue.ignore.multicriteria.codePoint.ruleKey=javascript:S7758
sonar.issue.ignore.multicriteria.codePoint.resourceKey=**/*
# S7747 (spread in for...of): the copies snapshot a map the loop writes to, or a listener set a
# listener may unsubscribe from while it runs.
sonar.issue.ignore.multicriteria.spreadIter.ruleKey=javascript:S7747
sonar.issue.ignore.multicriteria.spreadIter.resourceKey=**/*
# S7721 (move function to the outer scope): small helpers stay next to their only caller.
sonar.issue.ignore.multicriteria.outerScope.ruleKey=javascript:S7721
sonar.issue.ignore.multicriteria.outerScope.resourceKey=**/*
# S7773 (Number.parseInt / Number.NaN): the globals are the same functions and values.
sonar.issue.ignore.multicriteria.numberStatic.ruleKey=javascript:S7773
sonar.issue.ignore.multicriteria.numberStatic.resourceKey=**/*
# S7744 (`...(x || {})`): the fallback documents that x may be missing; spreading null is a no-op either way.
sonar.issue.ignore.multicriteria.spreadFallback.ruleKey=javascript:S7744
sonar.issue.ignore.multicriteria.spreadFallback.resourceKey=**/*
# S7766 (Math.min / Math.max): the comparisons read as the clamps they are.
sonar.issue.ignore.multicriteria.mathMinMax.ruleKey=javascript:S7766
sonar.issue.ignore.multicriteria.mathMinMax.resourceKey=**/*
# S7770 (pass Number directly): the named `tabId` converter says what the number is.
sonar.issue.ignore.multicriteria.numberWrapper.ruleKey=javascript:S7770
sonar.issue.ignore.multicriteria.numberWrapper.resourceKey=**/*
# S7768 (node.before()): insertBefore is what the tests' fake DOM (test/renderer-harness.js) implements.
sonar.issue.ignore.multicriteria.domBefore.ruleKey=javascript:S7768
sonar.issue.ignore.multicriteria.domBefore.resourceKey=**/*
# S7776 (use a Set): the arrays hold two or three entries; a Set buys nothing.
sonar.issue.ignore.multicriteria.setHas.ruleKey=javascript:S7776
sonar.issue.ignore.multicriteria.setHas.resourceKey=**/*
# S7765 (includes()): `indexOf(x) < 0` is equivalent; a matter of taste.
sonar.issue.ignore.multicriteria.includes.ruleKey=javascript:S7765
sonar.issue.ignore.multicriteria.includes.resourceKey=**/*
# S7741 (typeof x === 'undefined'): equivalent here, and the usual guard for what a fake document lacks.
sonar.issue.ignore.multicriteria.typeofUndef.ruleKey=javascript:S7741
sonar.issue.ignore.multicriteria.typeofUndef.resourceKey=**/*
# S7750 (findLast): filter().pop() is equivalent on the short lists it runs on.
sonar.issue.ignore.multicriteria.findLast.ruleKey=javascript:S7750
sonar.issue.ignore.multicriteria.findLast.resourceKey=**/*
# S7784 (structuredClone): the JSON round trip is a deliberate "plain JSON data only" copy
# (structuredClone would keep undefined, Dates and Maps the JSON form drops).
sonar.issue.ignore.multicriteria.structuredClone.ruleKey=javascript:S7784
sonar.issue.ignore.multicriteria.structuredClone.resourceKey=**/*

# S2004 (functions nested more than 4 deep): the renderer IIFE wrapper plus the mount closure
# and its event handlers use up the budget before any real nesting starts.
sonar.issue.ignore.multicriteria.nesting.ruleKey=javascript:S2004
sonar.issue.ignore.multicriteria.nesting.resourceKey=**/*
# S3776 (cognitive complexity): the remaining functions are reviewed; the worst (40 and over)
# were split into helpers.
sonar.issue.ignore.multicriteria.cognitive.ruleKey=javascript:S3776
sonar.issue.ignore.multicriteria.cognitive.resourceKey=**/*
